name: Feature request
description: An idea to make practising with Looplab better
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What do you want to do?
      description: Describe the practice situation, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
      description: Where would it live in the interface? Other apps that do it well are a great reference.
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I would like to help build it
