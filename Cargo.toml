[workspace]
resolver = "3"
members = ["src-tauri", "crates/audio-engine"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[workspace.lints.rust]
unused = "warn"

[workspace.lints.clippy]
all = "warn"

[profile.dev]
incremental = false
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 0

# DSP must be fast even in development, otherwise the audio crackles
[profile.dev.package.audio-engine]
opt-level = 2
