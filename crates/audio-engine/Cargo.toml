[package]
name = "audio-engine"
description = "Looplab audio engine: decoding, playback, DSP. Pure Rust, no Tauri."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
# Serde + specta derives on the types the app sends and saves (EQ, channel mode)
typed = ["dep:serde", "dep:specta"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"], optional = true }
# Same pinned rc as the app (tauri-specta has no stable release yet)
specta = { version = "=2.0.0-rc.26", features = ["derive"], optional = true }
cpal = "0.18.2"
rtrb = "0.4.1"
rubato = "5.0.1"
# Already used by rubato: the note view reuses it
realfft = "3.5.1"
# Decoded tracks live in cache files mapped into memory, not in RAM
memmap2 = "0.9.12"
symphonia = { version = "0.6.1", default-features = false, features = [
  "aac",
  "alac",
  "flac",
  "mp3",
  "pcm",
  "vorbis",
  "aiff",
  "isomp4",
  "mkv",
  "ogg",
  "wav",
  "id3v1",
  "id3v2",
  "ape",
  "opt-simd",
] }

[lints]
workspace = true

[build-dependencies]
cc = "1"
